name: tests
on: 
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:             
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
          environments: test
      - run: pixi run -e test test
