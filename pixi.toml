[workspace]
name = "edge-mppi"
version = "0.1.0"
description = "Real-time MPPI control, GPU-accelerated, under a hard latency budget"
authors = ["arthurfou"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.26"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.8"
pyyaml = ">=6.0"
cmake = ">=3.24"
ninja = ">=1.11"
pytest = ">=9.1.1,<10"
rich = ">=13"
yaml-cpp = ">=0.8.0,<0.9"

# CUDA toolkit (nvcc): compiles anywhere, running needs the cluster GPU node.
# The test environment leaves it out so CI stays light.
[feature.cuda.target.linux-64.dependencies]
cuda-toolkit = "12.*"

[environments]
default = { features = ["cuda"], solve-group = "default" }
test = { features = [], solve-group = "default" }

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
clean = "rm -rf build"

# Latency sweep on the CUDA implementation
bench = { cmd = "python bench/run_bench.py --config config/mppi.yaml", depends-on = [
  "build",
] }

# Non-regression: per-trajectory costs, Python vs CUDA, on a fixed noise tensor
check = { cmd = "python bench/check_parity.py --config config/mppi.yaml", depends-on = [
  "build",
] }

# STEP 1
track = "python python/generate_track.py --config config/mppi.yaml"
test = { cmd = "pytest -q python/tests", env = { PYTHONPATH = "python" }, depends-on = ["track"] }
sim = { cmd = "python python/run_sim.py --config config/mppi.yaml --model {{ model }} {{ save }}", args = [{ arg = "model", default = "dynamic" }, { arg = "save", default = "" }], depends-on = ["track"] }
sweep = { cmd = "python bench/sweep.py", depends-on = ["track"] }

# STEP 2
compare = { cmd = "python bench/compare_models.py", depends-on = ["track"] }
sim-kin = { cmd = "python python/run_sim.py --config config/mppi.yaml --model kinematic", depends-on = ["track"] }
sim-both = { cmd = "python python/run_sim.py --config config/mppi.yaml --model both", depends-on = ["track"] }
tires = "python bench/plot_tires.py"
video = { cmd = "python python/video.py {{ traj }} --config config/mppi.yaml", args = [{ arg = "traj", default = "results/trajectories/step2_dynamic.npz" }], depends-on = ["track"] }
video-mppi = { cmd = "python python/video_mppi.py --config config/mppi.yaml", depends-on = ["track"] }
video-lap = { cmd = "python python/video_mppi.py --config config/mppi.yaml --lap", depends-on = ["track"] }
# Vidéo du README (docs/media/), à relancer après `pixi run sim` ; le GIF demande ffmpeg
media = { cmd = "python python/video_mppi.py --config config/mppi.yaml --lap --out docs/media/mppi_lap.mp4 && ffmpeg -loglevel error -y -i docs/media/mppi_lap.mp4 -vf 'fps=15,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse=dither=bayer:bayer_scale=5' docs/media/mppi_lap.gif", depends-on = ["track"] }
all = [{ task = "track" }, { task = "sim" }, { task = "sweep" }, { task = "compare" }, { task = "tires" }]
# De manière équivalente : 
# all = { depends-on = ["track", "sim", "sweep", "compare", "tires"] }